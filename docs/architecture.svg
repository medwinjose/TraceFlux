<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">TraceFlux architecture</title>
  <desc id="d">A React dashboard calls a single FastAPI process over REST and receives WebSocket events. A fraud report runs a replay check, a time-respecting breadth-first search, and, for each frozen account, a score breakdown, a plain-language reason, a hash-chained HMAC-signed evidence record and an alert record, then broadcasts one event per hop. The process keeps the transaction graph, the evidence chain and the alerts in memory; simulate.py builds the synthetic graph at startup and on reset.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .state { fill: #ddf4ff; stroke: #54aeff; }
    .accent { fill: #fff8c5; stroke: #d4a72c; }
    .t { fill: #1f2328; font-size: 13px; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n { fill: #ffffff; font-size: 11px; font-weight: 700; }
    .dot { fill: #0969da; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ws { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: #59636e; }
    .arrowws { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #3d444d; }
      .box { fill: #0d1117; stroke: #656c76; }
      .state { fill: #0c2d4a; stroke: #1f6feb; }
      .accent { fill: #3b2e05; stroke: #9e6a03; }
      .t, .h { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .dot { fill: #1f6feb; }
      .line { stroke: #9198a1; }
      .ws { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrowws { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowws" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="620" rx="8"/>

  <!-- Dashboard -->
  <rect class="panel" x="16" y="70" width="200" height="530" rx="8"/>
  <text class="h" x="30" y="98">React dashboard</text>
  <text class="s m" x="30" y="116">frontend/</text>
  <text class="t" x="30" y="170">Canvas force-directed</text>
  <text class="t" x="30" y="188">transaction graph</text>
  <text class="t" x="30" y="220">Risk, evidence, alert,</text>
  <text class="t" x="30" y="238">watchlist and settings</text>
  <text class="t" x="30" y="256">views</text>
  <text class="s" x="30" y="292">Vite dev proxy or nginx:</text>
  <text class="s m" x="30" y="309">/api → backend :8000</text>

  <!-- FastAPI process -->
  <rect class="panel" x="262" y="20" width="476" height="580" rx="8"/>
  <text class="h" x="278" y="46">FastAPI process</text>
  <text class="s m" x="404" y="46">backend/main.py</text>

  <rect class="box" x="282" y="62" width="436" height="68" rx="6"/>
  <text class="t" x="296" y="84">Read endpoints (scores refreshed on read)</text>
  <text class="s m" x="296" y="103">GET /accounts  /graph_data  /accounts/{id}/explain  /alerts</text>
  <text class="s m" x="296" y="120">GET /evidence_chain  /evidence_chain/verify  /settings</text>

  <text class="t m" x="282" y="160">POST /report_fraud/{id}</text>

  <!-- Pipeline steps -->
  <g>
    <rect class="box" x="318" y="172" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="194" r="10"/><text class="n" x="336" y="198" text-anchor="middle">1</text>
    <text class="t" x="354" y="190">Replay check: HTTP 409 if already reported</text>
    <text class="s m" x="354" y="206">security.py</text>

    <rect class="box" x="318" y="230" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="252" r="10"/><text class="n" x="336" y="256" text-anchor="middle">2</text>
    <text class="t" x="354" y="248">Time-respecting BFS, freeze accounts reached</text>
    <text class="s m" x="354" y="264">graph_engine.py · max_hops 3 via API</text>

    <rect class="accent" x="300" y="284" width="426" height="234" rx="6" fill-opacity="0.6"/>
    <text class="s" x="312" y="300">for each frozen account</text>

    <rect class="box" x="318" y="306" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="328" r="10"/><text class="n" x="336" y="332" text-anchor="middle">3</text>
    <text class="t" x="354" y="324">Per-feature risk score breakdown</text>
    <text class="s m" x="354" y="340">ml_engine/anomaly_scorer.py</text>

    <rect class="box" x="318" y="358" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="380" r="10"/><text class="n" x="336" y="384" text-anchor="middle">4</text>
    <text class="t" x="354" y="376">Plain-language reason</text>
    <text class="s m" x="354" y="392">explainer.py</text>

    <rect class="box" x="318" y="410" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="432" r="10"/><text class="n" x="336" y="436" text-anchor="middle">5</text>
    <text class="t" x="354" y="428">Append SHA-256-chained, HMAC-signed record</text>
    <text class="s m" x="354" y="444">security.py</text>

    <rect class="box" x="318" y="462" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="484" r="10"/><text class="n" x="336" y="488" text-anchor="middle">6</text>
    <text class="t" x="354" y="480">Alert record</text>
    <text class="s m" x="354" y="496">dispatcher.py</text>

    <rect class="box" x="318" y="532" width="400" height="44" rx="6"/>
    <circle class="dot" cx="336" cy="554" r="10"/><text class="n" x="336" y="558" text-anchor="middle">7</text>
    <text class="t" x="354" y="550">Broadcast one TAG_PROPAGATED event per hop</text>
    <text class="s m" x="354" y="566">WebSocket /ws</text>
  </g>
  <path class="line" d="M518 216 V230" marker-end="url(#a)"/>
  <path class="line" d="M518 274 V306" marker-end="url(#a)"/>
  <path class="line" d="M518 350 V358" marker-end="url(#a)"/>
  <path class="line" d="M518 402 V410" marker-end="url(#a)"/>
  <path class="line" d="M518 454 V462" marker-end="url(#a)"/>
  <path class="line" d="M518 518 V532" marker-end="url(#a)"/>

  <!-- In-memory state -->
  <text class="h" x="784" y="46">In-memory state</text>

  <rect class="box" x="784" y="62" width="200" height="68" rx="6"/>
  <text class="t m" x="798" y="84">simulate.py</text>
  <text class="s" x="798" y="103">Synthetic graph with injected</text>
  <text class="s" x="798" y="120">9-account mule network</text>

  <rect class="state" x="784" y="216" width="200" height="140" rx="6"/>
  <text class="t" x="798" y="240">TransactionGraph</text>
  <text class="s" x="798" y="260">Accounts with freeze status</text>
  <text class="s" x="798" y="277">and risk score</text>
  <text class="s" x="798" y="297">Timestamped transfers with</text>
  <text class="s" x="798" y="314">inbound and outbound lists</text>
  <text class="s" x="798" y="334">per account</text>

  <rect class="state" x="784" y="398" width="200" height="62" rx="6"/>
  <text class="t" x="798" y="422">EvidenceChain</text>
  <text class="s" x="798" y="442">Records, processed report IDs</text>

  <rect class="state" x="784" y="470" width="200" height="50" rx="6"/>
  <text class="t" x="798" y="494">AlertDispatcher</text>
  <text class="s" x="798" y="511">Alert records</text>

  <path class="line" d="M884 130 V216" marker-end="url(#a)"/>
  <text class="s" x="876" y="166" text-anchor="end">builds at startup</text>
  <text class="s" x="876" y="182" text-anchor="end">and on POST /reset</text>

  <path class="line" d="M718 252 H784" marker-end="url(#a)"/>
  <path class="line" d="M718 328 H784" marker-end="url(#a)"/>
  <path class="line" d="M718 432 H784" marker-end="url(#a)"/>
  <path class="line" d="M718 484 H784" marker-end="url(#a)"/>

  <!-- Dashboard links -->
  <path class="line" d="M216 96 H282" marker-end="url(#a)"/>
  <text class="s" x="224" y="88">REST</text>
  <path class="line" d="M216 194 H318" marker-end="url(#a)"/>
  <text class="s" x="224" y="186">report</text>
  <path class="ws" d="M318 554 H216" marker-end="url(#aw)"/>
  <text class="s" x="224" y="546">events</text>
</svg>
